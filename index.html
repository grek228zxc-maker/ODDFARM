function treeHash(n){let z=Math.imul(n+31,2654435761)>>>0;z^=z>>>16;z=Math.imul(z,2246822507);z^=z>>>13;return(z>>>0)/4294967296}

 if(!forest && (x<75||x>1530||y<70||y>1080))return false;
 if(forest && (x<1760||x>2470||y<140||y>1110))return false;

 return true;

/* ===== ALPHA 1.1: GARDEN WARS ACTION ===== */
const ACTION_GROW=[4300,6300,8500],ACTION_HARVEST_RANGE=2.7;

function actionNearest(side,x,z,max=ACTION_HARVEST_RANGE){let best=-1,dist=Infinity;for(let i=0;i<15;i++){const b=rushBeds[side][i],d=Math.hypot(b.baseX-x,b.baseZ-z);if(d<dist){dist=d;best=i}}return dist<=max?best:-1}
function actionPlot(side,i){return (side===0?rush.plots:rush.botPlots)[i]}
function actionPlant(side,i,automatic=false){if(!rush||rush.phase!=='playing'||i<0)return false;const now=performance.now(),p=actionPlot(side,i);if(p.crop>=0)return false;if(side===0&&!automatic){if(Math.hypot(rushBeds[0][i].baseX-rush.playerX,rushBeds[0][i].baseZ-rush.playerZ)>ACTION_HARVEST_RANGE)return false;if(now-rush.lastAction<240)return false;rush.lastAction=now;if(rush.spored[i]>now){rush.message='🍄 Грядка заражена';return false}}
 const crop=side===0?rush.selected:Math.floor(Math.random()*3);p.crop=crop;p.plantedAt=now;p.until=now+ACTION_GROW[crop];p.ready=false;if(side===0){rush.planted++;rush.message='🌱 Посаджено '+RUSH_CROPS[crop].icon+' — зачекай і збери [F]'}else rush.botPlanted++;return true}
function actionHarvest(side,i,automatic=false){if(!rush||rush.phase!=='playing'||i<0)return false;const now=performance.now(),p=actionPlot(side,i);if(p.crop<0||now<p.until)return false;if(side===0&&!automatic){if(Math.hypot(rushBeds[0][i].baseX-rush.playerX,rushBeds[0][i].baseZ-rush.playerZ)>ACTION_HARVEST_RANGE)return false;if(now-rush.lastAction<220)return false;rush.lastAction=now}
 const pts=RUSH_CROPS[p.crop].points+(side===0&&rush.bonusPointsUntil>now?1:0);p.crop=-1;p.ready=false;p.until=0;if(side===0){rush.score+=pts;rush.harvested++;rush.combo++;rush.maxCombo=Math.max(rush.maxCombo,rush.combo);if(rush.combo%5===0)rush.score+=5;rush.message='🥬 Урожай +'+pts+(rush.combo%5===0?' · КОМБО +5!':'')}else{rush.botScore+=pts;rush.botHarvested++;if(rush.botHarvested%5===0)rush.botScore+=5}return true}
// Keep existing pointer controls, but clicking a 3D bed is now proximity-limited.
rushPlant=function(i){if(!rush||!rush.action)return;const p=rush.plots[i];if(p&&p.crop>=0)actionHarvest(0,i);else actionPlant(0,i);rushRender()};
gwPlant=function(i,automatic=false){if(!rush||!rush.action)return;actionPlant(0,i,automatic);rushRender()};

rushBotPlant=function(now){if(!rush||!rush.action)return;rush.botNext=now+800};
function actionInteract(type){if(!rush||rush.phase!=='playing')return;const i=actionNearest(0,rush.playerX,rush.playerZ);if(i<0){rush.message='Підійди до грядки';return}if(type==='harvest'){if(!actionHarvest(0,i))rush.message='🌱 Рослина ще не дозріла або грядка порожня'}else if(!actionPlant(0,i))rush.message='Ця грядка зайнята — збери врожай [F]';rushRender()}
function actionAbility(kind){if(!rush||rush.phase!=='playing')return;const now=performance.now(),cd=rush.cooldowns;if(now<cd[kind])return;if(kind==='dash'){cd.dash=now+6500;rush.dashUntil=now+600;rush.message='💨 Ривок!'}if(kind==='grow'){cd.grow=now+13000;let n=0;for(let i=0;i<15;i++){const p=rush.plots[i];if(p.crop>=0&&p.until>now){p.until=Math.max(now,p.until-2800);n++}}rush.message='🌿 Прискорено '+n+' рослин'}if(kind==='blast'){cd.blast=now+16000;const dist=Math.hypot(rush.playerX-rush.botX,rush.playerZ-rush.botZ);if(dist<14){rush.botStunned=now+2600;rush.message='💥 Суперник сповільнений!'}else rush.message='💥 Хвиля не дістала суперника'}rushRender()}
function actionBot(dt,now){if(now<rush.botStunned)return;const plots=rush.botPlots;let goal=-1,task='plant',best=Infinity;
 for(let i=0;i<15;i++){const p=plots[i];if(p.crop>=0&&p.until<=now){const d=Math.hypot(rushBeds[1][i].baseX-rush.botX,rushBeds[1][i].baseZ-rush.botZ);if(d<best){best=d;goal=i;task='harvest'}}}
 if(goal<0){best=Infinity;for(let i=0;i<15;i++){if(plots[i].crop>=0)continue;const d=Math.hypot(rushBeds[1][i].baseX-rush.botX,rushBeds[1][i].baseZ-rush.botZ)+Math.random()*.2;if(d<best){best=d;goal=i}}}
 if(goal<0)return;const bed=rushBeds[1][goal],dx=bed.baseX-rush.botX,dz=bed.baseZ-rush.botZ,len=Math.hypot(dx,dz);if(len>1.25){const speed=5.9*dt;rush.botX+=dx/len*Math.min(speed,len);rush.botZ+=dz/len*Math.min(speed,len)}else if(now>=rush.botNext){if(task==='harvest')actionHarvest(1,goal,true);else actionPlant(1,goal,true);rush.botNext=now+550+Math.random()*420}
 const actor=rushWorld.userData.actors[1];actor.position.set(rush.botX,0,rush.botZ);if(len>.1)actor.rotation.y=Math.atan2(dx,dz)}
const actionOldTick=rushTick;
rushTick=function(){if(!rush||rush.phase!=='playing')return;const now=performance.now(),dt=Math.min(.05,(now-(rush.actionTime||now))/1000);rush.actionTime=now;actionOldTick();if(!rush||rush.phase!=='playing')return;actionBot(dt,now);if(Math.floor(now/160)!==rush.actionHudTick){rush.actionHudTick=Math.floor(now/160);rushRender()}};
const actionOld3D=rush3DUpdate;
rush3DUpdate=function(now){if(!rush||!rush.action){actionOld3D(now);return}for(let side=0;side<2;side++)for(let i=0;i<15;i++){const v=rushBeds[side][i],p=actionPlot(side,i),planted=p.crop>=0,ready=planted&&now>=p.until;v.crop.visible=planted;v.soil.material.color.setHex(ready?0xd4b55d:planted?0x8e664a:0xb17d56);if(planted){v.fruit.material.color.setHex(RUSH_CROPS[p.crop].color);const progress=Math.min(1,(now-p.plantedAt)/ACTION_GROW[p.crop]);v.crop.scale.setScalar(.25+.75*progress);v.crop.position.y=.66+Math.sin(now*.003+i)*.045;v.crop.rotation.y=now*.0004+i;v.fruit.scale.set(p.crop===1?1.2:1,p.crop===2?.85:1,p.crop===2?1.25:1)}}};
const actionOldRender=rushRender;
rushRender=function(){if(!rush||rush.phase!=='playing'||!rush.action){actionOldRender();return}const now=performance.now(),remaining=Math.max(0,Math.ceil((rush.end-now)/1000)),near=actionNearest(0,rush.playerX,rush.playerZ),p=near>=0?rush.plots[near]:null,tip=near<0?'Підійди до грядки':p.crop<0?'🌱 Вільна грядка [E]':p.until<=now?'🥬 Урожай готовий [F]':'⏳ Росте '+Math.ceil((p.until-now)/1000)+' с';const cooldown=k=>now>=rush.cooldowns[k]?'ГОТОВО':Math.ceil((rush.cooldowns[k]-now)/1000)+' с';$('rushOverlay').style.display='block';$('rushOverlay').innerHTML=`<div class="rush3dHud"><div class="rush3dScores"><span>🌾 ТИ <b>${rush.score}</b></span><span>⏱ ${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}</span><span>🤖 БОТ <b>${rush.botScore}</b></span></div><div class="gwInfo">${tip}<div class="gwEnergy"><div style="width:${rush.energy*10}%"></div></div><small>💧 ${rush.energy.toFixed(1)}/10 · Зібрано ${rush.harvested} · WASD рух · E садити · F збирати</small></div><div class="actionAbilities"><button data-action="dash">💨 Ривок [Space]<small>${cooldown('dash')}</small></button><button data-action="grow">🌿 Ріст [Q]<small>${cooldown('grow')}</small></button><button data-action="blast">💥 Хвиля [R]<small>${cooldown('blast')}</small></button></div><div class="gwHand">${rush.hand.map((id,i)=>{const c=GW_CARDS[id];return `<button data-gw="card:${i}" ${rush.energy<c.cost?'disabled':''}><strong>${c.icon} ${c.name}</strong><small>${c.desc}</small><em>💧 ${c.cost} · ${i+4}</em></button>`}).join('')}</div><div class="rush3dBottom"><div class="rush3dSeeds">${RUSH_CROPS.map((c,i)=>`<button class="${rush.selected===i?'active':''}" data-rush="seed:${i}">${c.icon}</button>`).join('')}</div><button data-action="plant">🌱 E</button><button data-action="harvest">🥬 F</button><span>${rush.message}</span><button data-rush="forfeit">Вийти</button></div></div>`};
const actionOldLobby=rushLobby;
rushLobby=function(){actionOldLobby();const h=$('rushOverlay').querySelector('.rushShell');if(h){h.querySelector('h2').textContent='🏆 GARDEN WARS · ACTION 3D';const paras=h.querySelectorAll('p');if(paras[0])paras[0].innerHTML='Тепер це <b>повний 3D-екшен!</b> Бігай WASD, саджай [E], чекай дозрівання й збирай [F]. Очки дає <b>лише зібраний урожай</b>. Space — ривок, Q — прискорення росту, R — хвиля. Карти 4–7 — необов’язкові бонуси. Бот теж бігає та збирає врожай.';if(paras[1])paras[1].innerHTML='🥕 +1 · 🎃 +2 · 🍉 +3 за <b>зібраний</b> урожай · кожні 5 зборів +5 · 3 хвилини.'}}
$('rushOverlay').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='plant'||a==='harvest')actionInteract(a);else actionAbility(a)});
addEventListener('keydown',e=>{if(!rush||rush.phase!=='playing'||e.repeat)return;if(e.code==='KeyF'){e.preventDefault();actionInteract('harvest')}else if(e.code==='Space'){e.preventDefault();actionAbility('dash')}else if(e.code==='KeyQ'){e.preventDefault();actionAbility('grow')}else if(e.code==='KeyR'){e.preventDefault();actionAbility('blast')}},true);

/* ODDFARM Alpha 1.8.1 — five authored carrot bed stages. Original terrain / engine untouched. */
(function loadAuthoredBeds(){
 const oldModels=PLM.map(m=>m.assetBed);
 if(!THREE.GLTFLoader){console.warn('[ODDFARM beds] GLTFLoader unavailable; keeping Claude beds');return}
 const loader=new THREE.GLTFLoader();
 loader.load('assets/base-crops-storage.glb',gltf=>{
  try{
   const groups=Array.from({length:5},()=>new THREE.Group());
   gltf.scene.updateMatrixWorld(true);
   gltf.scene.traverse(o=>{
    if(!o.isMesh)return;
    let n=o;while(n&&!/^ofpart_/.test(n.name))n=n.parent;
    const hit=n&&/^ofpart_(\d+)_/.exec(n.name);
    if(!hit)return;const idx=Number(hit[1]);if(idx<0||idx>=5)return;
    const c=o.clone();o.matrixWorld.decompose(c.position,c.quaternion,c.scale);
    c.castShadow=true;c.receiveShadow=true;
    groups[idx].add(c);
   });
   if(groups.some(g=>!g.children.length))throw Error('Missing one or more bed stages');
   const boxes=groups.map(g=>new THREE.Box3().setFromObject(g));
   const baseSize=boxes[0].getSize(new THREE.Vector3());
   const fit=Math.min(3.7/baseSize.x,3.7/baseSize.z,3/baseSize.y);
   if(!Number.isFinite(fit)||fit<=0)throw Error('Invalid bed dimensions');
   groups.forEach((g,i)=>{const b=boxes[i],center=b.getCenter(new THREE.Vector3());
    g.scale.setScalar(fit);g.position.set(-center.x*fit,-b.min.y*fit,-center.z*fit);
   });
   PLM.forEach(m=>{m.authoredBeds=groups.map(g=>{const c=g.clone(true);c.visible=false;m.g.add(c);return c});
    if(m.assetBed)m.assetBed.visible=false;
   });
   window.oddfarmBedsFiveReady=true;
   console.info('[ODDFARM] Five Blender bed stages loaded');
  }catch(err){console.warn('[ODDFARM beds] Failed to prepare stages',err);
    PLM.forEach((m,i)=>{if(oldModels[i])oldModels[i].visible=true})}
 },undefined,err=>console.warn('[ODDFARM beds] GLB unavailable; original Claude beds retained',err));
})();
function loop(n){requestAnimationFrame(loop);try{const dt=Math.min(.05,(n-last)/1000||0);last=n;T=n/1000;upd(dt);sync(dt);syncBeyond(dt);hudU();questHUD();rush3DFrame();renderer.render(scene,cam3)}catch(e){dbg(e.message)}}

 });
